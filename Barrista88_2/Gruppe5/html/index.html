<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/barrista88.js" defer></script>
    <title>Barrista88</title>
</head>
<body>
        <div class="maschinencontainer">
      
        <img src="../assets/Kaffee.png"
             alt="Bild einer Kaffeemaschine" class="kaffeemaschine"> 
         
        <div id="display">

            <img src="../assets/off.png"
                 alt="Power aus Symbol"
                 id = "aus">
            
            <div id="hauptmenü">
                <button class="grid-button"
                        id="getränke">
                    <img src="../assets/getränke.jpg"
                        alt="Bild für das Getränkemenü">
                    Getränke</button>
                <button class="grid-button"
                        id="auffüllen">
                    <img src="../assets/Auffüllen.png"
                        alt="Bild für das Auffüllmenü">
                    Auffüllen</button>
                <button class="grid-button"
                        id="reinigen">
                    <img src="../assets/reinigen.jpg"
                        alt="Bild für das Reinigungsmenü">
                    Reinigen</button>
                <button class="grid-button"
                        id="statistik">
                    <img src="../assets/Statistikjpg.jpg"
                        alt="Bild für das Statistikmenü">
                    Statistik</button>
                <button class="grid-button"
                        id="geheim">
                    <img src="../assets/fragezeichen.png"
                        alt="Bild für das Geheimmenü">
                    ?</button>
                <button class="grid-button"
                        id="spezial">
                    <img src="../assets/special.jpg"
                        alt="Bild für das Spezialmenü">
                    Spezial</button>
            </div>
            
            <div id="getränkemenü"
                 class="versteckt">
                <button class="grid-button"
                        id="kaffee">
                <img src="../assets/Kaffee.jpg"
                     alt="Bild einer Tasse Kaffee">
                Kaffee
                </button>
                <button class="grid-button"
                        id="brühe">
                <img src="../assets/Brühe.jpg"
                     alt="Bild einer TAsse Brühe">
                Brühe
                </button>
                <button class="grid-button"
                        id="kakao">
                <img src="../assets/Kakao.jpg"
                     alt="Bild einer TAsse Kakao">
                Kakao
                </button>
                <button class="grid-button"
                        id="milch">
                <img src="../assets/Milch.jpg"
                     alt="Bild eines Glaß heisser Milch">
                Milch
                </button>
            </div>

            <div id = "spezialmenü"
                 class="versteckt">
                 <button class="grid-button"
                        id="iceT">
                <img src="../assets/icet.webp"
                     alt="Bild eines Long Island Ice Tea">
                Long Island Ice Tea
                </button>
                <button class="grid-button"
                        id="pina">
                <img src="../assets/pinacolada.webp"
                     alt="Bild eines Pina Colada">
                Pina Colada
                </button>
                <button class="grid-button"
                        id="gin">
                <img src="../assets/gin.webp"
                     alt="Bild eines Gin Tonic">
                Gin Tonic
                </button>
                <button class="grid-button"
                        id="moscow">
                <img src="../assets/moscowmule.webp"
                     alt="Bild eines Moscow Mule">
                Moscow Mule
                </button>
                <button class="grid-button"
                        id="russian">
                <img src="../assets/whiterussian.webp"
                     alt="Bild eines White Russian">
                White Russian
                </button>
            </div>


            <button class="grid-button"
                    id="abbruch">
            <img src="../assets/abbruch.png"
                  alt="Bild eines roten X">
            Abbruch
            </button>
            <p id="fortschritt"></p>
        </div>

        <div id="power"></div>

    </div>

</body>
</html>
